; Explorer Watcher - program paths (optional). Put this file next to the exe.
; Remove the ';' at the start of a line and set the real path.
; Series / Movies / Player / Files: if empty, the tile opens the built-in file browser.
;Series=
;Movies=
;Player=\Storage Card\Player\player.exe
;Files=
; Cars = the ORIGINAL radio / navigation program of the head unit
;Cars=\Storage Card\Navi\navi.exe
;Usb=       (program that switches the device to USB / PC connection mode)
;Subs=      (optional subtitle program)
; Taskbar is hidden by default. To keep it visible:
;Taskbar=show
